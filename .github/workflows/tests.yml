name: Tests

on:
  push:
    paths:
      - "analysis.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "analysis.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
